<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOLOCHAT — Salon privé sans serveur</title>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      position: relative;
      overflow-x: hidden;
    }

    /* Couche des snowflakes */
    .snow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }
    .snowflake {
      position: absolute;
      top: -24px;
      color: rgba(255, 255, 255, 0.75);
      user-select: none;
      pointer-events: none;
      animation-name: snowfall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.35);
    }
    @keyframes snowfall {
      0% {
        transform: translate3d(0, -24px, 0) rotate(0deg);
      }
      50% {
        transform: translate3d(18px, 50vh, 0) rotate(180deg);
      }
      100% {
        transform: translate3d(-12px, 105vh, 0) rotate(360deg);
      }
    }

    header.top,
    .chat-container {
      position: relative;
      z-index: 2;
    }

    .chat-container {
      width: 100%;
      max-width: 820px;
      margin: 2rem auto;
      background: var(--panel, #1e293b);
      color: var(--ink, #f8fafc);
      border: 1px solid var(--line, #334155);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      padding: 16px 20px;
      background: var(--bg, #0f172a);
      border-bottom: 1px solid var(--line, #334155);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .chat-header h1 { margin: 0; font-size: 1.15rem; color: var(--ink, #f8fafc); }
    .sub { color: var(--muted, #94a3b8); font-size: 0.85rem; }
    .box { padding: 20px; }
    .grid { display: grid; gap: 12px; }
    .two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 680px) { .two-cols { grid-template-columns: 1fr; } }
    .chat-card {
      background: var(--bg, #0f172a);
      border: 1px solid var(--line, #334155);
      border-radius: 12px;
      padding: 16px;
      display: grid;
      gap: 10px;
      align-content: start;
    }
    .chat-container input,
    .chat-container textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--panel, #1e293b);
      color: var(--ink, #f8fafc);
      border: 1px solid var(--line, #334155);
      border-radius: 8px;
      font: inherit;
    }
    .chat-container button {
      padding: 10px 14px;
      background: var(--accent, #5cff8a);
      color: var(--accent-ink, #06202a);
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .chat-container button:hover {
      background: #8dffad;
    }
    .chat-container button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .chat-container button.secondary {
      background: transparent;
      color: var(--accent, #5cff8a);
      border: 1px solid var(--line, #334155);
    }
    .chat-container button.secondary:hover {
      background: rgba(92, 255, 138, 0.1);
    }
    .chat-container button.danger {
      background: transparent;
      color: #ff5c5c;
      border: 1px solid #ff5c5c;
    }
    .code-badge {
      font-family: monospace;
      font-size: 1rem;
      background: var(--panel, #1e293b);
      color: var(--accent, #5cff8a);
      border: 1px dashed var(--accent, #5cff8a);
      padding: 6px 10px;
      border-radius: 8px;
      user-select: all;
    }
    .messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 420px;
      overflow-y: auto;
      padding: 16px 20px;
    }
    .msg {
      background: var(--bg, #0f172a);
      border: 1px solid var(--line, #334155);
      border-radius: 10px;
      padding: 12px;
      overflow-wrap: anywhere;
    }
    .msg.sys {
      border-style: dashed;
      color: var(--muted, #94a3b8);
      font-size: 0.85rem;
      padding: 8px 12px;
    }
    .msg-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--muted, #94a3b8);
      margin-bottom: 6px;
    }
    .msg img {
      max-width: 100%;
      max-height: 320px;
      border-radius: 8px;
      margin-top: 8px;
      display: block;
    }
    .composer {
      border-top: 1px solid var(--line, #334155);
      padding: 16px 20px;
      background: var(--bg, #0f172a);
      display: grid;
      gap: 10px;
    }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .error { color: #ff5c5c; font-size: 0.9rem; }
    .ok { color: var(--accent, #5cff8a); font-size: 0.9rem; }
    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      background: rgba(92, 255, 138, 0.15);
      color: var(--accent, #5cff8a);
    }
  </style>
</head>
<body>
  <div class="snow" id="snowLayer" aria-hidden="true"></div>

  <header class="top" style="width: 100%;">
    <div class="wrap" style="width: 100%; max-width: 100%;">
      <a class="logo" href="index.html">LOÏC<span>.</span>BRACALE</a>
      <nav aria-label="Navigation principale">
        <a href="index.html#jeux">Mes jeux</a>
        <a href="index.html#profil">Profil</a>
        <a href="chat.html" class="active">Lolochat</a>
        <a href="index.html#contact">Me retrouver</a>
      </nav>
    </div>
  </header>

  <div class="chat-container" id="app"></div>

  <script>
    (function initSnowflakes() {
      const layer = document.getElementById("snowLayer");
      if (!layer) return;
      const count = 36;
      const glyphs = ["❄", "•", "❅"];
      for (let i = 0; i < count; i++) {
        const flake = document.createElement("span");
        flake.className = "snowflake";
        flake.textContent = glyphs[i % glyphs.length];
        flake.style.left = (Math.random() * 100).toFixed(2) + "%";
        flake.style.fontSize = (10 + Math.random() * 12).toFixed(1) + "px";
        flake.style.opacity = (0.25 + Math.random() * 0.65).toFixed(2);
        const duration = (7 + Math.random() * 10).toFixed(2);
        const delay = (-Math.random() * 12).toFixed(2);
        flake.style.animationDuration = duration + "s";
        flake.style.animationDelay = delay + "s";
        layer.appendChild(flake);
      }
    })();

    const MAX_TEXT = 2000;
    const MAX_IMG_BYTES = 350 * 1024;
    const BROKERS = [
      "wss://broker.emqx.io:8084/mqtt",
      "wss://broker.hivemq.com:8884/mqtt"
    ];

    let state = {
      view: "auth",
      pseudo: "",
      roomCode: "",
      topic: "",
      client: null,
      clientId: "lolo_" + Math.random().toString(36).slice(2, 10),
      seenIds: new Set(),
      membersMap: new Map(),
      messages: [],
      pendingImage: null,
      pendingImageName: "",
      error: "",
      status: "",
      busy: false,
      presenceTimer: null
    };

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function generateRoomCode() {
      const part1 = Math.floor(1000 + Math.random() * 9000);
      const part2 = Math.random().toString(36).substring(2, 6).toUpperCase();
      return `LOLO-${part1}-${part2}`;
    }

    function normalizeCode(raw) {
      return String(raw || "").trim().toUpperCase().replace(/\s+/g, "");
    }

    async function sha256(text) {
      if (window.crypto && window.crypto.subtle) {
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
      }
      let h = 0;
      for (let i = 0; i < text.length; i++) {
        h = ((h << 5) - h) + text.charCodeAt(i);
        h |= 0;
      }
      return Math.abs(h).toString(16);
    }

    async function checkOrSaveLocalAccount(pseudo, password) {
      const key = "lolochat_accounts_v2";
      const accounts = JSON.parse(localStorage.getItem(key) || "{}");
      const hash = await sha256(password);
      const lower = pseudo.toLowerCase();

      if (accounts[lower] && accounts[lower] !== hash) {
        return false;
      }
      accounts[lower] = hash;
      localStorage.setItem(key, JSON.stringify(accounts));
      return true;
    }

    function addSystemMessage(text) {
      state.messages.push({
        id: "sys_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
        system: true,
        text
      });
      render();
    }

    function getActiveMembers() {
      const now = Date.now();
      const names = [state.pseudo];
      for (const [id, info] of state.membersMap.entries()) {
        if (now - info.lastSeen < 22000) {
          names.push(info.pseudo);
        } else {
          state.membersMap.delete(id);
        }
      }
      return [...new Set(names)];
    }

    function updateMembersUI() {
      const el = document.getElementById("membersBar");
      if (!el) return;
      const active = getActiveMembers();
      el.innerHTML = `
        <h1>LOLOCHAT <span class="pill">${active.length} en ligne</span></h1>
        <div class="sub">Connecté : <strong>${escapeHtml(state.pseudo)}</strong> (${active.map(escapeHtml).join(", ")})</div>
      `;
    }

    function publishPacket(packet) {
      if (state.client && state.client.connected && state.topic) {
        try {
          state.client.publish(state.topic, JSON.stringify({
            ...packet,
            senderId: state.clientId,
            pseudo: state.pseudo,
            ts: Date.now()
          }));
        } catch {
          state.error = "Échec de l'envoi réseau (message peut-être trop lourd).";
          render();
        }
      }
    }

    function cleanupClient() {
      if (state.presenceTimer) {
        clearInterval(state.presenceTimer);
        state.presenceTimer = null;
      }
      if (state.client) {
        try {
          if (state.client.connected && state.topic) {
            state.client.publish(state.topic, JSON.stringify({
              type: "leave",
              senderId: state.clientId,
              pseudo: state.pseudo,
              ts: Date.now()
            }));
          }
          state.client.end(true);
        } catch {}
        state.client = null;
      }
      state.busy = false;
    }

    async function connectToRoom(pseudo, code, isCreator) {
      if (typeof window.mqtt === "undefined") {
        state.error = "La bibliothèque réseau (MQTT) n'a pas pu se charger. Vérifie ta connexion ou désactive un bloqueur de scripts.";
        return render();
      }

      cleanupClient();
      state.busy = true;
      state.error = "";
      state.status = "Connexion au salon sécurisé...";
      render();

      const topicHash = await sha256("lolochat-secret-salt-" + code);
      const topic = `lolochat/v2/room/${topicHash}`;

      let brokerIndex = 0;
      let connectedOnce = false;

      const tryConnect = () => {
        const url = BROKERS[brokerIndex];
        const client = window.mqtt.connect(url, {
          clientId: state.clientId,
          clean: true,
          connectTimeout: 8000,
          reconnectPeriod: 3000
        });
        state.client = client;

        client.on("connect", () => {
          connectedOnce = true;
          client.subscribe(topic, (err) => {
            if (err) {
              cleanupClient();
              state.error = "Impossible d'accéder au canal du salon.";
              return render();
            }

            state.busy = false;
            state.view = "chat";
            state.pseudo = pseudo;
            state.roomCode = code;
            state.topic = topic;
            state.status = "";
            state.membersMap.clear();

            publishPacket({ type: "join" });
            addSystemMessage(
              isCreator
                ? `Salon créé. Partage le code ${code} en privé pour inviter tes amis.`
                : `Connecté au salon ${code}.`
            );

            if (state.presenceTimer) clearInterval(state.presenceTimer);
            state.presenceTimer = setInterval(() => {
              publishPacket({ type: "ping" });
              updateMembersUI();
            }, 6000);
          });
        });

        client.on("message", (_t, payload) => {
          try {
            const data = JSON.parse(payload.toString());
            if (!data || data.senderId === state.clientId) return;

            state.membersMap.set(data.senderId, {
              pseudo: data.pseudo || "Membre",
              lastSeen: Date.now()
            });

            if (data.type === "join") {
              publishPacket({ type: "ping" });
              addSystemMessage(`${data.pseudo} a rejoint le salon.`);
            } else if (data.type === "leave") {
              state.membersMap.delete(data.senderId);
              addSystemMessage(`${data.pseudo} a quitté le salon.`);
            } else if (data.type === "chat" && data.msg && !state.seenIds.has(data.msg.id)) {
              state.seenIds.add(data.msg.id);
              state.messages.push(data.msg);
              render();
            } else if (data.type === "ping") {
              updateMembersUI();
            }
          } catch {}
        });

        client.on("error", () => {
          if (!connectedOnce) {
            try { client.end(true); } catch {}
            brokerIndex++;
            if (brokerIndex < BROKERS.length) {
              tryConnect();
            } else {
              cleanupClient();
              state.error = "Impossible de joindre le relais réseau. Vérifie ta connexion Internet.";
              render();
            }
          }
        });
      };

      tryConnect();
    }

    async function createRoom(e) {
      e.preventDefault();
      if (state.busy) return;
      const pseudo = document.getElementById("hostPseudo").value.trim();
      const pw = document.getElementById("hostPw").value;

      if (!pseudo || pw.length < 4) {
        state.error = "Entre un pseudo et un mot de passe (4 caractères minimum).";
        return render();
      }
      if (!await checkOrSaveLocalAccount(pseudo, pw)) {
        state.error = "Mot de passe incorrect pour ce pseudo sur cet appareil.";
        return render();
      }

      await connectToRoom(pseudo, generateRoomCode(), true);
    }

    async function joinRoom(e) {
      e.preventDefault();
      if (state.busy) return;
      const pseudo = document.getElementById("guestPseudo").value.trim();
      const pw = document.getElementById("guestPw").value;
      const code = normalizeCode(document.getElementById("joinCode").value);

      if (!pseudo || pw.length < 4 || !code) {
        state.error = "Remplis le pseudo, le mot de passe (4+ caractères) et le code d'invitation.";
        return render();
      }
      if (!await checkOrSaveLocalAccount(pseudo, pw)) {
        state.error = "Mot de passe incorrect pour ce pseudo sur cet appareil.";
        return render();
      }

      await connectToRoom(pseudo, code, false);
    }

    function handleImage(e) {
      const file = e.target.files[0];
      state.error = "";
      if (!file) {
        state.pendingImage = null;
        state.pendingImageName = "";
        return render();
      }
      if (!["image/png", "image/gif"].includes(file.type)) {
        state.error = "Seules les images PNG et GIF sont acceptées.";
        e.target.value = "";
        return render();
      }
      if (file.size > MAX_IMG_BYTES) {
        state.error = "Pour passer par le relais réseau, l'image doit faire maximum 350 Ko.";
        e.target.value = "";
        return render();
      }
      const reader = new FileReader();
      reader.onload = () => {
        state.pendingImage = reader.result;
        state.pendingImageName = file.name;
        state.status = "Image prête : " + file.name;
        render();
      };
      reader.readAsDataURL(file);
    }

    function clearPendingImage() {
      state.pendingImage = null;
      state.pendingImageName = "";
      state.status = "";
      const fileInput = document.getElementById("imgInput");
      if (fileInput) fileInput.value = "";
      render();
    }

    function sendMessage(e) {
      e.preventDefault();
      state.error = "";
      state.status = "";
      const input = document.getElementById("msgText");
      const text = input ? input.value.trim() : "";

      if (text.length > MAX_TEXT) {
        state.error = "Maximum 2 000 caractères.";
        return render();
      }
      if (!text && !state.pendingImage) {
        state.error = "Écris un message ou choisis une image PNG/GIF.";
        return render();
      }

      const msg = {
        id: Date.now() + "_" + Math.random().toString(36).slice(2, 8),
        author: state.pseudo,
        text,
        image: state.pendingImage,
        time: new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })
      };

      state.seenIds.add(msg.id);
      state.messages.push(msg);
      publishPacket({ type: "chat", msg });

      if (input) input.value = "";
      state.pendingImage = null;
      state.pendingImageName = "";
      render();
      document.getElementById("msgText")?.focus();
    }

    function copyCode() {
      navigator.clipboard?.writeText(state.roomCode);
      state.status = "Code copié dans le presse-papiers !";
      render();
    }

    function leaveRoom() {
      cleanupClient();
      state = {
        view: "auth",
        pseudo: "",
        roomCode: "",
        topic: "",
        client: null,
        clientId: "lolo_" + Math.random().toString(36).slice(2, 10),
        seenIds: new Set(),
        membersMap: new Map(),
        messages: [],
        pendingImage: null,
        pendingImageName: "",
        error: "",
        status: "",
        busy: false,
        presenceTimer: null
      };
      render();
    }

    window.addEventListener("beforeunload", cleanupClient);

    function render() {
      const app = document.getElementById("app");
      if (!app) return;

      const draftEl = document.getElementById("msgText");
      const draftText = draftEl ? draftEl.value : "";

      if (state.view === "auth") {
        app.innerHTML = `
          <div class="chat-header">
            <div>
              <h1>LOLOCHAT</h1>
              <div class="sub">Salon privé sécurisé sans serveur</div>
            </div>
          </div>
          <div class="box grid">
            ${state.error ? `<div class="error">${escapeHtml(state.error)}</div>` : ""}
            ${state.status ? `<div class="ok">${escapeHtml(state.status)}</div>` : ""}
            <div class="two-cols">
              <form class="chat-card" onsubmit="createRoom(event)">
                <strong>1. Créer un salon</strong>
                <div class="sub">Génère un code unique pour inviter tes amis.</div>
                <input id="hostPseudo" placeholder="Ton pseudo" maxlength="25" required />
                <input id="hostPw" type="password" placeholder="Mot de passe" required />
                <button type="submit" ${state.busy ? "disabled" : ""}>Créer le salon</button>
              </form>

              <form class="chat-card" onsubmit="joinRoom(event)">
                <strong>2. Rejoindre un salon</strong>
                <div class="sub">Entre le code fourni par ton ami.</div>
                <input id="guestPseudo" placeholder="Ton pseudo" maxlength="25" required />
                <input id="guestPw" type="password" placeholder="Mot de passe" required />
                <input id="joinCode" placeholder="Code (ex: LOLO-1234-ABCD)" required />
                <button type="submit" class="secondary" ${state.busy ? "disabled" : ""}>Rejoindre</button>
              </form>
            </div>
          </div>
        `;
        return;
      }

      const activeMembers = getActiveMembers();

      app.innerHTML = `
        <div class="chat-header">
          <div id="membersBar">
            <h1>LOLOCHAT <span class="pill">${activeMembers.length} en ligne</span></h1>
            <div class="sub">Connecté : <strong>${escapeHtml(state.pseudo)}</strong> (${activeMembers.map(escapeHtml).join(", ")})</div>
          </div>
          <div class="row">
            <span class="code-badge" title="Code à partager">${escapeHtml(state.roomCode)}</span>
            <button type="button" class="secondary" onclick="copyCode()">Copier</button>
            <button type="button" class="danger" onclick="leaveRoom()">Quitter</button>
          </div>
        </div>
        ${(state.error || state.status) ? `<div class="box" style="padding-bottom:0">
          ${state.error ? `<div class="error">${escapeHtml(state.error)}</div>` : ""}
          ${state.status ? `<div class="ok">${escapeHtml(state.status)}</div>` : ""}
        </div>` : ""}
        <div class="messages" id="msgList">
          ${state.messages.map(m => m.system
            ? `<div class="msg sys">${escapeHtml(m.text)}</div>`
            : `
              <div class="msg">
                <div class="msg-head">
                  <strong>${escapeHtml(m.author)}</strong>
                  <span>${escapeHtml(m.time)}</span>
                </div>
                ${m.text ? `<div>${escapeHtml(m.text).replaceAll("\n", "<br>")}</div>` : ""}
                ${m.image ? `<img src="${m.image}" alt="Image jointe" />` : ""}
              </div>
            `
          ).join("")}
        </div>
        <form class="composer" onsubmit="sendMessage(event)">
          <textarea id="msgText" rows="3" maxlength="${MAX_TEXT}" placeholder="Écris ton message (Entrée pour envoyer, Maj+Entrée pour nouvelle ligne)...">${escapeHtml(draftText)}</textarea>
          ${state.pendingImage ? `
            <div class="row">
              <span class="sub">Pièce jointe : <strong>${escapeHtml(state.pendingImageName)}</strong></span>
              <button type="button" class="secondary" onclick="clearPendingImage()">Retirer l'image</button>
            </div>
          ` : ""}
          <div class="row" style="justify-content:space-between">
            <input id="imgInput" type="file" accept="image/png,image/gif" onchange="handleImage(event)" style="max-width:280px" />
            <button type="submit">Envoyer</button>
          </div>
        </form>
      `;

      const list = document.getElementById("msgList");
      if (list) list.scrollTop = list.scrollHeight;

      const msgInput = document.getElementById("msgText");
      if (msgInput) {
        msgInput.onkeydown = (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            msgInput.form?.requestSubmit();
          }
        };
      }
    }

    render();
  </script>
</body>
</html>
