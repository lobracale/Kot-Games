<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0c1210">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L’imposteur </title>
<style>
:root{--bg:#0c1210;--panel:#141d19;--soft:#1e2b25;--line:#25362f;--ink:#e8f1ec;--muted:#93a89d;--accent:#5cff8a;--accent-ink:#06160c;--warn:#ffd95a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:1.05rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.top{border-bottom:1px solid var(--line);padding:.8rem 1.25rem}
.top a{color:var(--muted);text-decoration:none;font-weight:600}
.top a:hover{color:var(--accent)}
h1{color:var(--ink);text-align:center;font-size:clamp(2.4rem,9vw,4.5rem);font-weight:900;letter-spacing:-.03em;line-height:1;margin:2rem 12px 1rem}
main{max-width:520px;margin:0 auto;padding:12px 16px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:14px}
h2{margin:0 0 14px;font-size:1.8rem;text-align:center}
p{line-height:1.5}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer;border:2px solid var(--accent);border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:12px 16px;width:100%;font-size:1.05rem;margin-top:10px}
button:hover{background:#8dffad}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:transparent;color:var(--accent);font-size:.95rem;padding:8px}
button.ghost:hover{background:rgba(92,255,138,.1)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.row{display:flex;gap:8px}.row button{width:auto;margin-top:0}
.chips{list-style:none;padding:0;margin:14px 0 0}
.chips li{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:8px;padding:8px 12px;margin-bottom:6px}
.chips button{width:auto;margin:0;padding:2px 10px;background:transparent;color:var(--ink);border:0;font-size:20px}
.big{font-size:clamp(2.2rem,12vw,3.6rem);font-weight:900;color:var(--accent);text-align:center;margin:18px 0}
.center{text-align:center}.warn{color:var(--warn);font-weight:bold}
.vote{background:var(--soft);color:var(--ink);border-color:var(--line)}
.vote:hover{background:var(--line)}
.log{background:rgba(0,0,0,.25);border-radius:8px;padding:8px 12px;margin-top:14px;font-size:15px}
.log div{padding:2px 0}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 22px}
details p{color:var(--muted)}
summary{cursor:pointer;font-weight:bold}
.win{font-size:1.6rem;font-weight:900;color:var(--accent);text-align:center}
label{display:block;margin:12px 0 6px;font-size:14px;color:var(--muted)}
.code{font-size:3rem;font-weight:900;letter-spacing:8px;color:var(--accent)}
input.up{text-transform:uppercase;text-align:center;letter-spacing:4px}
</style>
</head>
<body>
<header class="top"><a href="index.html#jeux">← Retour à mes jeux</a></header>
<h1>L’imposteur</h1>
<main id="app"></main>
<script>
var PAIRS=[["Chat","Chien"],["Pizza","Tarte flambée"],["Plage","Piscine"],["Café","Thé"],["Guitare","Violon"],["Avion","Hélicoptère"],["Football","Rugby"],["Pomme","Poire"],["Vélo","Trottinette"],["Cinéma","Théâtre"],["Pluie","Neige"],["Médecin","Infirmier"],["Château","Palais"],["Boulangerie","Pâtisserie"],["Lion","Tigre"],["Train","Métro"],["Chocolat","Caramel"],["Montagne","Colline"],["Roman","Journal"],["Pyjama","Peignoir"],["Fromage","Beurre"],["Crayon","Stylo"],["Lune","Soleil"],["Pirate","Viking"]];
var ONLINE=typeof claude!=="undefined";
var S={step:ONLINE?"home":"setup",msg:"",players:[],rounds:2,i:0,turn:0,round:0,clues:[],votes:[],word:"",impWord:"",imp:-1,shown:false};
var app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rules(){return '<details><summary>Règles</summary><p>Tout le monde possède le même mot sauf une personne : c’est l’imposteur. L’imposteur lui-même ne sait pas qu’il est l’imposteur (son mot est simplement proche des autres).</p><p>Chacun à votre tour, écrivez un mot pour prouver que vous n’êtes pas l’imposteur. Ensuite, tout le monde vote.</p><p>L’imposteur gagne s’il n’est pas le plus voté (en cas d’égalité, il gagne). Sinon, les autres joueurs gagnent.</p></details>'}
function start(){
  var p=shuffle(PAIRS)[0];if(Math.random()<.5)p=[p[1],p[0]];
  S.word=p[0];S.impWord=p[1];S.imp=Math.floor(Math.random()*S.players.length);
  S.players=shuffle(S.players);S.imp=-1;
  S.imp=Math.floor(Math.random()*S.players.length);
  S.i=0;S.shown=false;S.clues=[];S.votes=[];S.turn=0;S.round=0;S.step="reveal";render();
}
function render(){
  var h="",n=S.players.length;
  if(S.step==="home"){
    h+='<div class="card center"><h2>Jouer</h2><button id="mOnline">Jouer en ligne (plusieurs appareils)</button><button id="mLocal">Un seul appareil</button>'+(S.msg?'<p class="warn">'+esc(S.msg)+'</p>':'')+'</div>'+rules();
  }else if(S.step==="setup"){
    h+='<div class="card"><h2>Joueurs</h2><label for="nm">Nom du joueur</label><div class="row"><input id="nm" maxlength="16" placeholder="Entre ton nom" autocomplete="off"><button id="add" style="padding:0 18px">Ajouter</button></div><ul class="chips">';
    S.players.forEach(function(p,k){h+='<li>'+esc(p)+'<button data-rm="'+k+'" aria-label="Retirer '+esc(p)+'">×</button></li>'});
    h+='</ul><label for="rd">Tours d’indices</label><select id="rd">';
    [1,2,3].forEach(function(r){h+='<option value="'+r+'"'+(r===S.rounds?' selected':'')+'>'+r+'</option>'});
    h+='</select><button id="go"'+(n<3?' disabled':'')+'>Lancer la partie</button>';
    if(n<3)h+='<p class="center">Ajoute au moins 3 joueurs.</p>';
    if(ONLINE)h+='<button class="ghost" id="home">Accueil</button>';
    h+='</div>'+rules();
  }else if(S.step==="reveal"){
    var nm=esc(S.players[S.i]);
    h+='<div class="card center"><h2>'+nm+'</h2>';
    if(!S.shown){h+='<p>Passe l’appareil à <b>'+nm+'</b>. Les autres ne regardent pas !</p><button id="see">Voir mon mot</button>'}
    else{h+='<p>Ton mot est :</p><div class="big">'+esc(S.i===S.imp?S.impWord:S.word)+'</div><p class="warn">Retiens-le, puis cache l’écran.</p><button id="hide">'+(S.i<n-1?'Joueur suivant':'Commencer les indices')+'</button>'}
    h+='</div>';
  }else if(S.step==="clue"){
    h+='<div class="card center"><h2>Tour '+(S.round+1)+' / '+S.rounds+'</h2><p>C’est à <b>'+esc(S.players[S.turn])+'</b> d’écrire un mot.</p><input id="cl" maxlength="24" placeholder="Ton indice" autocomplete="off"><button id="ok">Valider</button>';
    if(S.clues.length){h+='<div class="log">';S.clues.forEach(function(c){h+='<div><b>'+esc(c[0])+'</b> : '+esc(c[1])+'</div>'});h+='</div>'}
    h+='</div>';
  }else if(S.step==="vote"){
    var v=S.votes.length;
    h+='<div class="card center"><h2>Vote</h2><p><b>'+esc(S.players[v])+'</b>, qui est l’imposteur ?</p>';
    S.players.forEach(function(p,k){if(k!==v)h+='<button class="vote" data-v="'+k+'">'+esc(p)+'</button>'});
    h+='<div class="log">';S.clues.forEach(function(c){h+='<div><b>'+esc(c[0])+'</b> : '+esc(c[1])+'</div>'});h+='</div></div>';
  }else if(S.step==="result"){
    var t=S.players.map(function(){return 0});S.votes.forEach(function(x){t[x]++});
    var max=Math.max.apply(null,t),top=[];t.forEach(function(x,k){if(x===max)top.push(k)});
    var caught=top.length===1&&top[0]===S.imp;
    h+='<div class="card center"><h2>Résultat</h2><p class="win">'+(caught?'Les joueurs gagnent !':'L’imposteur gagne !')+'</p><p>L’imposteur était <b>'+esc(S.players[S.imp])+'</b>.</p><p>Mot du groupe : <b>'+esc(S.word)+'</b><br>Mot de l’imposteur : <b>'+esc(S.impWord)+'</b></p><div class="log">';
    S.players.forEach(function(p,k){h+='<div>'+esc(p)+' : '+t[k]+' vote'+(t[k]>1?'s':'')+'</div>'});
    h+='</div><button id="again">Rejouer</button><button class="ghost" id="reset">Changer les joueurs</button></div>';
  }
  app.innerHTML=h;bind();
}
function bind(){
  function $(i){return document.getElementById(i)}
  if($("add")){
    var add=function(){var v=$("nm").value.trim();if(v&&S.players.indexOf(v)<0&&S.players.length<12){S.players.push(v)}render();$("nm").focus()};
    $("add").onclick=add;$("nm").onkeydown=function(e){if(e.key==="Enter")add()};
    $("rd").onchange=function(){S.rounds=+this.value};
    $("go").onclick=start;
    [].forEach.call(document.querySelectorAll("[data-rm]"),function(b){b.onclick=function(){S.players.splice(+b.dataset.rm,1);render()}});
  }
  if($("see"))$("see").onclick=function(){S.shown=true;render()};
  if($("hide"))$("hide").onclick=function(){S.shown=false;if(S.i<S.players.length-1){S.i++}else{S.step="clue"}render()};
  if($("ok")){
    var ok=function(){var v=$("cl").value.trim();if(!v)return;S.clues.push([S.players[S.turn],v]);S.turn++;
      if(S.turn>=S.players.length){S.turn=0;S.round++;if(S.round>=S.rounds)S.step="vote"}render()};
    $("ok").onclick=ok;$("cl").onkeydown=function(e){if(e.key==="Enter")ok()};$("cl").focus();
  }
  [].forEach.call(document.querySelectorAll("[data-v]"),function(b){b.onclick=function(){S.votes.push(+b.dataset.v);if(S.votes.length>=S.players.length)S.step="result";render()}});
  if($("again"))$("again").onclick=start;
  if($("home"))$("home").onclick=function(){S.step="home";render()};
  if($("mLocal"))$("mLocal").onclick=function(){S.msg="";S.step="setup";render()};
  if($("mOnline"))$("mOnline").onclick=onlineInit;
  if($("reset"))$("reset").onclick=function(){S.players=[];S.step="setup";render()};
}
/* ===== Mode en ligne ===== */
var O=null;
function gid(i){return document.getElementById(i)}
async function onlineInit(){
  S.msg="";S.step="online";app.innerHTML='<div class="card center"><p>Connexion…</p></div>';
  var done=false;
  function fail(){if(done)return;done=true;S.step="home";S.msg="Le mode en ligne n’est pas disponible ici. Ouvre la page depuis claude.ai, connecté à ton compte.";render()}
  var timer=setTimeout(fail,10000);
  try{
    if(typeof claude==="undefined")return fail();
    var db=await claude.use("db"),us=await claude.use("user");
    if(!db||!us)return fail();
    var uid=await us.id();
    if(!uid)return fail();
    if(done)return;done=true;clearTimeout(timer);
    O=O||{};O.db=db;O.uid=uid;O.name=O.name||"";O.err="";O.show=false;oReset();
  }catch(e){return fail()}
  oRender();
}
function oReset(){(O.un||[]).forEach(function(f){f()});O.un=[];O.code="";O.game=null;O.pl={};O.clues=[];O.votes=[]}
function oErr(e){O.err="Erreur : "+((e&&(e.message||e.code))||"inconnue");oRender()}
function oRender(){
  if(S.step!=="online"||!O)return;
  var kv=gid("ocl")?gid("ocl").value:"";
  var h="";
  if(!O.code){
    h='<div class="card"><h2>En ligne</h2><label for="on">Ton nom</label><input id="on" maxlength="16" autocomplete="off" value="'+esc(O.name)+'"><button id="oc">Créer une partie</button><label for="oj">Ou rejoins avec un code</label><div class="row"><input id="oj" class="up" maxlength="4" placeholder="ABCD" autocomplete="off"><button id="ojb" style="padding:0 18px">Rejoindre</button></div>'+(O.err?'<p class="warn">'+esc(O.err)+'</p>':'')+'<button class="ghost" id="oh">Accueil</button></div>'+rules();
  }else h=oGame();
  app.innerHTML=h;oBind();
  if(kv&&gid("ocl")){gid("ocl").value=kv;gid("ocl").focus()}
}
function oClues(){var G=O.game.g;return O.clues.filter(function(c){return c.g===G}).sort(function(a,b){return a.seq-b.seq})}
function oGame(){
  var g=O.game,h="",ids=Object.keys(O.pl);
  function nm(u){return esc(O.pl[u]||"?")}
  if(!g)return '<div class="card center"><p>Chargement…</p>'+(O.err?'<p class="warn">'+esc(O.err)+'</p>':'')+'<button class="ghost" id="oh">Accueil</button></div>';
  var head='<div class="card center"><p>Code de la partie</p><div class="code">'+esc(O.code)+'</div></div>';
  var leave='<button class="ghost" id="oh">Quitter</button>';
  var host=O.uid===g.host;
  if(g.phase==="lobby"){
    h=head+'<div class="card"><h2>Joueurs ('+ids.length+')</h2><ul class="chips">'+ids.map(function(u){return '<li>'+nm(u)+(u===g.host?' (hôte)':'')+(u===O.uid?' – toi':'')+'</li>'}).join('')+'</ul>';
    if(host){h+='<label for="orr">Tours d’indices</label><select id="orr">'+[1,2,3].map(function(r){return '<option'+(r===2?' selected':'')+'>'+r+'</option>'}).join('')+'</select><button id="ost"'+(ids.length<3?' disabled':'')+'>Lancer la partie</button>'+(ids.length<3?'<p class="center">Il faut au moins 3 joueurs. Partage le code.</p>':'')}
    else h+='<p class="center">En attente de l’hôte…</p>';
    return h+leave+'</div>';
  }
  var order=g.order,n=order.length;
  if(order.indexOf(O.uid)<0)return head+'<div class="card center"><p>La partie a déjà commencé. Tu joueras la prochaine manche.</p>'+leave+'</div>';
  var cl=oClues(),vo=O.votes.filter(function(v){return v.g===g.g});
  var p=PAIRS[g.pair],word=p[g.flip?1:0],impWord=p[g.flip?0:1],mine=O.uid===g.imp?impWord:word;
  var me='<div class="card center"><p>Ton mot</p>'+(O.show?'<div class="big">'+esc(mine)+'</div>':'')+'<button class="ghost" id="osh">'+(O.show?'Masquer':'Afficher')+' mon mot</button></div>';
  var log=cl.length?'<div class="log">'+cl.map(function(c){return '<div><b>'+nm(c.uid)+'</b> : '+esc(c.text)+'</div>'}).join('')+'</div>':'';
  if(cl.length<n*g.rounds){
    var cur=order[cl.length%n],r=Math.floor(cl.length/n)+1;
    h=head+me+'<div class="card center"><h2>Tour '+r+' / '+g.rounds+'</h2>';
    if(cur===O.uid)h+='<p class="warn">À toi d’écrire un mot !</p><input id="ocl" maxlength="24" placeholder="Ton indice" autocomplete="off"><button id="ook">Valider</button>';
    else h+='<p>C’est à <b>'+nm(cur)+'</b> d’écrire un mot…</p>';
    return h+log+'</div>';
  }
  if(vo.length<n){
    h=head+me+'<div class="card center"><h2>Vote</h2>';
    if(vo.some(function(v){return v.uid===O.uid}))h+='<p>Vote enregistré. En attente des autres ('+vo.length+' / '+n+')…</p>';
    else{h+='<p>Qui est l’imposteur ?</p>';order.forEach(function(u){if(u!==O.uid)h+='<button class="vote" data-ov="'+esc(u)+'">'+nm(u)+'</button>'})}
    return h+log+'</div>';
  }
  var t={},max=0;
  vo.forEach(function(v){t[v.target]=(t[v.target]||0)+1});
  order.forEach(function(u){if((t[u]||0)>max)max=t[u]});
  var top=order.filter(function(u){return (t[u]||0)===max}),caught=top.length===1&&top[0]===g.imp;
  h=head+'<div class="card center"><h2>Résultat</h2><p class="win">'+(caught?'Les joueurs gagnent !':'L’imposteur gagne !')+'</p><p>L’imposteur était <b>'+nm(g.imp)+'</b>.</p><p>Mot du groupe : <b>'+esc(word)+'</b><br>Mot de l’imposteur : <b>'+esc(impWord)+'</b></p><div class="log">'+order.map(function(u){var k=t[u]||0;return '<div>'+nm(u)+' : '+k+' vote'+(k>1?'s':'')+'</div>'}).join('')+'</div>';
  h+=host?'<button id="oag">Rejouer</button>':'<p>L’hôte peut relancer une manche.</p>';
  return h+leave+'</div>';
}
function oSub(code){
  O.code=code;O.err="";var base="games/"+code;
  O.un.push(O.db.doc(base).onSnapshot(function(s){O.game=s.exists?s.data():null;oRender()},oErr));
  O.un.push(O.db.collection(base+"/players").onSnapshot(function(s){O.pl={};s.docs.forEach(function(d){O.pl[d.id]=d.data().name});oRender()},oErr));
  O.un.push(O.db.collection(base+"/clues").onSnapshot(function(s){O.clues=s.docs.map(function(d){return d.data()});oRender()},oErr));
  O.un.push(O.db.collection(base+"/votes").onSnapshot(function(s){O.votes=s.docs.map(function(d){return d.data()});oRender()},oErr));
}
async function oCreate(name){
  try{
    var A="ABCDEFGHJKLMNPQRSTUVWXYZ",code="";
    for(var i=0;i<4;i++)code+=A[Math.floor(Math.random()*A.length)];
    await O.db.doc("games/"+code).set({host:O.uid,phase:"lobby",g:0,order:[],imp:"",pair:0,flip:false,rounds:2});
    await O.db.doc("games/"+code+"/players/"+O.uid).set({name:name});
    oSub(code);oRender();
  }catch(e){oErr(e)}
}
async function oJoin(name,code){
  try{
    var s=await O.db.doc("games/"+code).get();
    if(!s.exists){O.err="Code introuvable.";return oRender()}
    await O.db.doc("games/"+code+"/players/"+O.uid).set({name:name});
    oSub(code);oRender();
  }catch(e){oErr(e)}
}
function oStart(rounds){
  var order=shuffle(Object.keys(O.pl));
  O.db.doc("games/"+O.code).set({host:O.game.host,phase:"play",g:(O.game.g||0)+1,order:order,imp:order[Math.floor(Math.random()*order.length)],pair:Math.floor(Math.random()*PAIRS.length),flip:Math.random()<.5,rounds:rounds}).catch(oErr);
  O.show=false;
}
function oBind(){
  if(gid("oh"))gid("oh").onclick=function(){oReset();S.step="home";render()};
  if(gid("oc"))gid("oc").onclick=function(){var v=gid("on").value.trim();O.name=v;if(!v){O.err="Entre ton nom.";return oRender()}oCreate(v)};
  if(gid("ojb"))gid("ojb").onclick=function(){var v=gid("on").value.trim(),c=gid("oj").value.trim().toUpperCase();O.name=v;if(!v||c.length!==4){O.err="Entre ton nom et un code à 4 lettres.";return oRender()}oJoin(v,c)};
  if(gid("osh"))gid("osh").onclick=function(){O.show=!O.show;oRender()};
  if(gid("ost"))gid("ost").onclick=function(){oStart(+gid("orr").value)};
  if(gid("oag"))gid("oag").onclick=function(){oStart(O.game.rounds)};
  if(gid("ook")){
    var send=function(){var v=gid("ocl").value.trim();if(!v)return;var seq=oClues().length;
      O.db.doc("games/"+O.code+"/clues/g"+O.game.g+"_"+seq).set({g:O.game.g,seq:seq,uid:O.uid,text:v}).catch(oErr)};
    gid("ook").onclick=send;gid("ocl").onkeydown=function(e){if(e.key==="Enter")send()};
  }
  [].forEach.call(document.querySelectorAll("[data-ov]"),function(b){b.onclick=function(){
    O.db.doc("games/"+O.code+"/votes/g"+O.game.g+"_"+O.uid).set({g:O.game.g,uid:O.uid,target:b.dataset.ov}).catch(oErr)}});
}
render();
</script>
</body>
</html>
