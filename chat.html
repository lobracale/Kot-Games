<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOLOCHAT — Salon privé P2P sans serveur</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Styles spécifiques pour l'application LOLOCHAT */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
    }
    .chat-container {
      width: 100%;
      max-width: 820px;
      margin: 2rem auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      padding: 16px 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .chat-header h1 { margin: 0; font-size: 1.15rem; color: var(--ink); }
    .sub { color: var(--muted); font-size: 0.85rem; }
    .box { padding: 20px; }
    .grid { display: grid; gap: 12px; }
    .two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 680px) { .two-cols { grid-template-columns: 1fr; } }
    .chat-card {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      display: grid;
      gap: 10px;
      align-content: start;
    }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
    }
    .chat-container button {
      padding: 10px 14px;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .chat-container button:hover {
      background: #8dffad;
    }
    .chat-container button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .chat-container button.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--line);
    }
    .chat-container button.secondary:hover {
      background: rgba(92, 255, 138, 0.1);
    }
    .chat-container button.danger {
      background: transparent;
      color: #ff5c5c;
      border: 1px solid #ff5c5c;
    }
    .code-badge {
      font-family: monospace;
      font-size: 1rem;
      background: var(--panel);
      color: var(--accent);
      border: 1px dashed var(--accent);
      padding: 6px 10px;
      border-radius: 8px;
      user-select: all;
    }
    .messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 420px;
      overflow-y: auto;
      padding: 16px 20px;
    }
    .msg {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
    }
    .msg.sys {
      border-style: dashed;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 8px 12px;
    }
    .msg-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .msg img {
      max-width: 100%;
      max-height: 320px;
      border-radius: 8px;
      margin-top: 8px;
      display: block;
    }
    .composer {
      border-top: 1px solid var(--line);
      padding: 16px 20px;
      background: var(--bg);
      display: grid;
      gap: 10px;
    }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .error { color: #ff5c5c; font-size: 0.9rem; }
    .ok { color: var(--accent); font-size: 0.9rem; }
    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      background: rgba(92, 255, 138, 0.15);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="snow" aria-hidden="true"></div>

  <header class="top" style="width: 100%;">
    <div class="wrap" style="width: 100%; max-width: 100%;">
      <a class="logo" href="index.html">LOÏC<span>.</span>BRACALE</a>
      <nav aria-label="Navigation principale">
        <a href="index.html#jeux">Mes jeux</a>
        <a href="index.html#profil">Profil</a>
        <a href="chat.html" class="active">Lolochat</a>
        <a href="index.html#contact">Me retrouver</a>
      </nav>
    </div>
  </header>

  <div class="chat-container" id="app"></div>

  <script>
    const MAX_TEXT = 2000;
    const MAX_IMG_BYTES = 5 * 1024 * 1024;
    const PREFIX = "lolochat-v2-";

    const PEER_OPTIONS = {
      debug: 0,
      config: {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
          { urls: "stun:stun2.l.google.com:19302" },
          { urls: "stun:global.stun.twilio.com:3478" }
        ]
      }
    };

    let state = {
      view: "auth",
      role: null,
      pseudo: "",
      roomCode: "",
      peer: null,
      connections: [],
      members: [],
      messages: [],
      pendingImage: null,
      error: "",
      status: "",
      busy: false
    };

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function generateRoomCode() {
      const part1 = Math.floor(1000 + Math.random() * 9000);
      const part2 = Math.random().toString(36).substring(2, 6).toUpperCase();
      return `LOLO-${part1}-${part2}`;
    }

    function normalizeCode(raw) {
      return String(raw || "").trim().toUpperCase().replace(/\s+/g, "");
    }

    async function checkOrSaveLocalAccount(pseudo, password) {
      const key = "lolochat_p2p_accounts";
      const accounts = JSON.parse(localStorage.getItem(key) || "{}");
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(password));
      const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
      const lower = pseudo.toLowerCase();

      if (accounts[lower] && accounts[lower] !== hash) {
        return false;
      }
      accounts[lower] = hash;
      localStorage.setItem(key, JSON.stringify(accounts));
      return true;
    }

    function addSystemMessage(text) {
      state.messages.push({ id: Date.now() + Math.random(), system: true, text });
      render();
    }

    function broadcastAsHost(payload, excludeConn = null) {
      state.connections.forEach(conn => {
        if (conn.open && conn !== excludeConn) {
          conn.send(payload);
        }
      });
    }

    function updateMembersList() {
      if (state.role === "host") {
        const names = [
          state.pseudo,
          ...state.connections
            .filter(c => c.open && c.metadata?.pseudo)
            .map(c => c.metadata.pseudo)
        ];
        state.members = [...new Set(names)];
        broadcastAsHost({ type: "members", members: state.members });
      }
    }

    function cleanupPeer() {
      if (state.peer) {
        try { state.peer.destroy(); } catch {}
        state.peer = null;
      }
      state.connections = [];
      state.busy = false;
    }

    function explainPeerError(err, context = "connexion") {
      const type = err?.type || "";
      if (type === "network" || type === "socket-error" || type === "server-error") {
