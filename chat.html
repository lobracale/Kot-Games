<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOLOCHAT — Salon privé sans serveur</title>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      position: relative;
      overflow-x: hidden;
    }

    /* Couche des snowflakes verts du site de base */
    .snow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }
    .flake {
      position: absolute;
      top: -28px;
      color: var(--accent, #5cff8a);
      user-select: none;
      pointer-events: none;
      animation-name: flake-fall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      text-shadow: 0 0 8px rgba(92, 255, 138, 0.35);
    }
    @keyframes flake-fall {
      0% {
        transform: translate3d(0, -28px, 0) rotate(0deg);
      }
      100% {
        transform: translate3d(var(--drift, 0px), 106vh, 0) rotate(360deg);
      }
    }

    header.top,
    .chat-container {
      position: relative;
      z-index: 2;
    }

    .chat-container {
      width: 100%;
      max-width: 820px;
      margin: 2rem auto;
      background: var(--panel, #1e293b);
      color: var(--ink, #f8fafc);
      border: 1px solid var(--line, #334155);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      padding: 16px 20px;
      background: var(--bg, #0f172a);
      border-bottom: 1px solid var(--line, #334155);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .chat-header h1 { margin: 0; font-size: 1.15rem; color: var(--ink, #f8fafc); }
    .sub { color: var(--muted, #94a3b8); font-size: 0.85rem; }
    .box { padding: 20px; }
    .grid { display: grid; gap: 12px; }
    .two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 680px) { .two-cols { grid-template-columns: 1fr; } }
    .chat-card {
      background: var(--bg, #0f172a);
      border: 1px solid var(--line, #334155);
      border-radius: 12px;
      padding: 16px;
      display: grid;
      gap: 10px;
      align-content: start;
    }
    .chat-container input,
    .chat-container textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--panel, #1e293b);
      color: var(--ink, #f8fafc);
      border: 1px solid var(--line, #334155);
      border-radius: 8px;
      font: inherit;
    }
    .chat-container button {
      padding: 10px 14px;
      background: var(--accent, #5cff8a);
      color: var(--accent-ink, #06202a);
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .chat-container button:hover {
      background: #8dffad;
    }
    .chat-container button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .chat-container button.secondary {
      background: transparent;
      color: var(--accent, #5cff8a);
      border: 1px solid var(--line, #334155);
    }
    .chat-container button.secondary:hover {
      background: rgba(92, 255, 138, 0.1);
    }
    .chat-container button.danger {
      background: transparent;
      color: #ff5c5c;
      border: 1px solid #ff5c5c;
    }
    .code-badge {
      font-family: monospace;
      font-size: 1rem;
      background: var(--panel, #1e293b);
      color: var(--accent, #5cff8a);
      border: 1px dashed var(--accent, #5cff8a);
      padding: 6px 10px;
      border-radius: 8px;
      user-select: all;
    }
    .messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 420px;
      overflow-y: auto;
      padding: 16px 20px;
    }
    .msg {
      background: var(--bg, #0f172a);
      border: 1px solid var(--line, #334155);
      border-radius: 10px;
      padding: 12px;
      overflow-wrap: anywhere;
    }
    .msg.sys {
      border-style: dashed;
      color: var(--muted, #94a3b8);
      font-size: 0.85rem;
      padding: 8px 12px;
    }
    .msg-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--muted, #94a3b8);
      margin-bottom: 6px;
    }
    .msg img {
      max-width: 100%;
      max-height: 320px;
      border-radius: 8px;
      margin-top: 8px;
      display: block;
    }
    .composer {
      border-top: 1px solid var(--line, #334155);
      padding: 16px 20px;
      background: var(--bg, #0f172a);
      display: grid;
      gap: 10px;
    }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .error { color: #ff5c5c; font-size: 0.9rem; }
    .ok { color: var(--accent, #5cff8a); font-size: 0.9rem; }
    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      background: rgba(92, 255, 138, 0.15);
      color: var(--accent, #5cff8a);
    }
  </style>
</head>
<body>
  <div class="snow" aria-hidden="true"></div>

  <header class="top" style="width: 100%;">
    <div class="wrap" style="width: 100%; max-width: 100%;">
      <a class="logo" href="index.html">LOÏC<span>.</span>BRACALE</a>
      <nav aria-label="Navigation principale">
        <a href="index.html#jeux">Mes jeux</a>
        <a href="index.html#profil">Profil</a>
        <a href="chat.html" class="active">Lolochat</a>
        <a href="index.html#contact">Me retrouver</a>
      </nav>
    </div>
  </header>

  <div class="chat-container" id="app"></div>

  <script>
    (function () {
      var enter = document.getElementById("enter");
      var snow = document.querySelector(".snow");
      var seen = false;

      try {
        seen = sessionStorage.getItem("entered") === "1";
      } catch (e) {}

      if (enter) {
        function close() {
          enter.classList.add("hidden");
          try {
            sessionStorage.setItem("entered", "1");
          } catch (e) {}
        }

        if (seen) {
          enter.classList.add("hidden");
        } else {
          enter.focus();
        }

        enter.addEventListener("click", close);
        enter.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            close();
          }
        });
      }

      if (
        snow &&
        !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)
      ) {
        for (var i = 0; i < 28; i++) {
          var f = document.createElement("span");
          f.className = "flake";
          f.textContent = "⌖°❅°⌖";
          f.style.left = Math.random() * 100 + "%";
          f.style.fontSize = 10 + Math.random() * 12 + "px";
          f.style.opacity = 0.25 + Math.random() * 0.7;
          f.style.animationDuration = 6 + Math.random() * 10 + "s";
          f.style.animationDelay = Math.random() * -12 + "s";
          f.style.setProperty("--drift", -80 + Math.random() * 160 + "px");
          snow.appendChild(f);
        }
      }
    })();

    const MAX_TEXT = 2000;
    const MAX_IMG_BYTES = 350 * 1024;
    const BROKERS = [
      "wss://broker.emqx.io:8084/mqtt",
      "wss://broker.hivemq.com:8884/mqtt"
    ];

    let state = {
      view: "auth",
      pseudo: "",
      roomCode: "",
      topic: "",
      client: null,
      clientId: "lolo_" + Math.random().toString(36).slice(2, 10),
      seenIds: new Set(),
      membersMap: new Map(),
      messages: [],
      pendingImage: null,
      pendingImageName: "",
      error: "",
      status: "",
      busy: false,
      presenceTimer: null
    };

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function generateRoomCode() {
      const part1 = Math.floor(1000 + Math.random() * 9000);
      const part2 = Math.random().toString(36).substring(2, 6).toUpperCase();
      return `LOLO-${part1}-${part2}`;
    }

    function normalizeCode(raw) {
      return String(raw || "").trim().toUpperCase().replace(/\s+/g, "");
    }

    async function sha256(text) {
      if (window.crypto && window.crypto.subtle) {
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
      }
      let h = 0;
      for (let i = 0; i < text.length; i++) {
        h = ((h << 5) - h) + text.charCodeAt(i);
        h |= 0;
      }
      return Math.abs(h).toString(16);
    }

    async function checkOrSaveLocalAccount(pseudo, password) {
      const key = "lolochat_accounts_v2";
      const accounts = JSON.parse(localStorage.getItem(key) || "{}");
      const hash = await sha256(password);
      const lower = pseudo.toLowerCase();

      if (accounts[lower] && accounts[lower] !== hash) {
        return false;
      }
      accounts[lower] = hash;
      localStorage.setItem(key, JSON.stringify(accounts));
      return true;
    }

    function addSystemMessage(text) {
      state.messages.push({
        id: "sys_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
        system: true,
        text
      });
      render();
    }

    function getActiveMembers() {
      const now = Date.now();
      const names = [state.pseudo];
      for (const [id, info] of state.membersMap.entries()) {
        if (now - info.lastSeen < 22000) {
          names.push(info.pseudo);
        } else {
          state.membersMap.delete(id);
        }
      }
      return [...new Set(names)];
    }

    function updateMembersUI() {
      const el = document.getElementById("membersBar");
      if (!el) return;
      const active = getActiveMembers();
      el.innerHTML = `
        <h1>LOLOCHAT <span class="pill">${active.length} en ligne</span></h1>
        <div class="sub">Connecté : <strong>${escapeHtml(state.pseudo)}</strong> (${active.map(escapeHtml).join(", ")})</div>
      `;
    }

    function publishPacket(packet) {
      if (state.client && state.client.connected && state.topic) {
        try {
          state.client.publish(state.topic, JSON.stringify({
            ...packet,
            senderId: state.clientId,
            pseudo: state.pseudo,
            ts: Date.now()
          }));
        } catch {
          state.error = "Échec de l'envoi réseau (message peut-être trop lourd).";
          render();
        }
      }
    }

    function cleanupClient() {
      if (state.presenceTimer) {
        clearInterval(state.presenceTimer);
        state.presenceTimer = null;
      }
      if (state.client) {
        try {
          if (state.client.connected && state.topic) {
            state.client.publish(state.topic, JSON.stringify({
              type: "leave",
              senderId: state.clientId,
              pseudo: state.pseudo,
              ts: Date.now()
            }));
          }
          state.client.end(true);
        } catch {}
        state.client = null;
      }
      state.busy = false;
    }

    async function connectToRoom(pseudo, code, isCreator) {
      if (typeof window.mqtt === "undefined") {
        state.error = "La bibliothèque réseau (MQTT) n'a pas pu se charger. Vérifie ta connexion ou désactive un bloqueur de scripts.";
        return render();
      }

      cleanupClient();
      state.busy = true;
      state.error = "";
      state.status = "Connexion au salon sécurisé...";
      render();

      const topicHash = await sha256("lolochat-secret-salt-" + code);
      const topic = `lolochat/v2/room/${topicHash}`;

      let brokerIndex = 0;
      let connectedOnce = false;

      const tryConnect = () => {
        const url = BROKERS[brokerIndex];
        const client = window.mqtt.connect(url, {
          clientId: state.clientId,
          clean: true,
          connectTimeout: 8000,
          reconnectPeriod: 3000
        });
        state.client = client;

        client.on("connect", () => {
          connectedOnce = true;
          client.subscribe(topic, (err) => {
            if (err) {
              cleanupClient();
              state.error = "Impossible d'accéder au canal du salon.";
              return render();
            }

            state.busy = false;
            state.view = "chat";
            state.pseudo = pseudo;
            state.roomCode = code;
            state.topic = topic;
            state.status = "";
            state.membersMap.clear();

            publishPacket
